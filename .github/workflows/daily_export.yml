# daily_export.yml
name: Daily Export

on:
  schedule:
    # 日本時間16:00（UTC 07:00）。日本株の終値確定後に実行する。
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run export_data.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python export_data.py

      - name: Run backtest.py
        run: |
          python backtest.py

      - name: Debug file existence
        run: |
          ls -R data || echo "data folder does not exist"

      - name: Commit CSV and analysis reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data -f
          git add update_status.json
          git add reports/backtest_summary.json
          git status
          git commit -m "Daily export CSV and backtest report" || echo "No changes"
          git push
